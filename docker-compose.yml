services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linux-game
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=file:/data/prod.db
      - DATABASE_URL_TO_LIB=file:/data/prod.db
    restart: unless-stopped
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

volumes:
  app-data:

networks:
  app-network:
    driver: bridge
